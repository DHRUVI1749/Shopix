<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receipt History | SHOPIX</title>

    <link rel="stylesheet" href="css/receiptHistory.css">
    <link rel="stylesheet" href="css/shopix.css">

</head>

<body class="app-page">

    <header class="site-header">
        <div class="site-header-inner">
            <a href="dashboard.html" class="site-brand" aria-label="SHOPIX dashboard">
                <img src="images/logo.png" alt="" class="site-logo" width="40" height="40">
                <span class="site-brand-name">SHOPIX</span>
            </a>

            <a href="settings.html" class="account-link" aria-label="Open account settings" title="Account settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5"></circle>
                    <path d="M5.5 20c.6-3.2 2.9-5 6.5-5s5.9 1.8 6.5 5"></path>
                </svg>
            </a>
        </div>
    </header>

    <div class="app-shell">

        <!-- MAIN CONTENT -->
        <main class="history-container">

            <!-- PAGE TITLE -->
            <section class="history-intro">
                <div>
                    <p class="page-kicker">Receipt library</p>
                    <h1>Receipt History</h1>
                    <p>View, review and manage every receipt saved to your account.</p>
                </div>

                <a href="receiptScanner.html" class="upload-main-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    Scan Receipt
                </a>
            </section>

            <!-- RECEIPT LIST -->
            <section id="receiptList" class="receipt-list">

                <!-- Loading -->
                <div id="loadingMessage" class="message-box">
                    Loading receipts...
                </div>

                <!-- Empty State -->
                <div id="emptyMessage" class="message-box" style="display: none;">

                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"></path>
                            <path d="M9 8h6M9 12h6"></path>
                        </svg>
                    </div>

                    <h3>No receipts yet</h3>

                    <p>
                        Upload and save your first receipt
                        to see it here.
                    </p>

                    <a href="receiptScanner.html" class="scan-btn">
                        Scan Receipt
                    </a>

                </div>

            </section>

        </main>

        <!-- EXISTING RECEIPT JAVASCRIPT -->
        <script type="module" src="js/receiptHistory.js"></script>

    </div>


    <!-- SHOPIX COMMON HEADER -->
    <script type="module" src="js/header.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receipt Details | SHOPIX</title>

    <link rel="stylesheet" href="css/receiptDetails.css">


    <link rel="stylesheet" href="css/shopix.css">

</head>

<body class="app-page">

    <header class="site-header">
        <div class="site-header-inner">
            <a href="dashboard.html" class="site-brand" aria-label="SHOPIX dashboard">
                <img src="images/logo.png" alt="" class="site-logo" width="40" height="40">
                <span class="site-brand-name">SHOPIX</span>
            </a>

            <a href="settings.html" class="account-link" aria-label="Open account settings" title="Account settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5"></circle>
                    <path d="M5.5 20c.6-3.2 2.9-5 6.5-5s5.9 1.8 6.5 5"></path>
                </svg>
            </a>
        </div>
    </header>



    <div class="app-shell">

    <!-- HEADER -->
    <div class="page-header">

        <div class="header-left">


            <a href="receiptHistory.html" class="back-btn">
                ←
            </a>

            <div>
                <h1>Receipt Details</h1>
                <p>View your receipt information</p>
            </div>

        </div>

    </div>


    <!-- MAIN -->
    <main class="details-container">

        <div id="loadingMessage" class="message-box">
            Loading receipt...
        </div>


        <!-- RECEIPT DETAILS -->
        <section id="receiptDetails" class="details-card"
                 style="display: none;">

            <div class="receipt-image-container">

                <img
                    id="receiptImage"
                    src=""
                    alt="Receipt"
                >

            </div>


            <div class="receipt-information">

                <h2 id="storeName">
                    —
                </h2>


                <div class="detail-row">

                    <span>Purchase Date</span>

                    <strong id="purchaseDate">
                        —
                    </strong>

                </div>


                <div class="detail-row">

                    <span>Total Amount</span>

                    <strong id="totalAmount">
                        ₹0
                    </strong>

                </div>


                <div class="detail-row">

                    <span>Category</span>

                    <strong id="category">
                        —
                    </strong>

                </div>


                <!-- ITEMS -->

                <div class="items-section">

                    <h3>Purchased Items</h3>

                    <div id="itemsList">
                        No items found.
                    </div>

                </div>


                <div class="delete-section">

                    <button id="deleteReceiptBtn" class="delete-btn">
                        Delete Receipt
                    </button>

                </div>

            </div>

        </section>


        <div id="errorMessage"
             class="message-box"
             style="display: none;">

            Unable to load receipt.

        </div>

    </main>




<script
        type="module"
        src="js/receiptDetails.js">
    </script>

    </div>


    <!-- SHOPIX COMMON HEADER -->
    <script type="module" src="js/header.js"></script>
</body>

</html>
